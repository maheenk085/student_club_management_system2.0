{% extends "base.html" %}

{% block title %}My Profile - ClubHub 2.0{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1>My Profile</h1>
        <p>Member since {{ user.created_at.strftime('%d %b %Y') }}</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-card">
            <form method="POST" action="{{ url_for('student_profile') }}">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>

                <label for="email">Email (cannot be changed)</label>
                <input type="email" id="email" value="{{ user.email }}" readonly class="readonly-input">

                <label for="student_number">Student Number</label>
                <input type="text" id="student_number" name="student_number" value="{{ user.student_number or '' }}">

                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ user.phone or '' }}">

                <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
